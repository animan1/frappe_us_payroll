server {
	listen 443 ssl;
	server_name frappe-us-payroll.localhost;

	ssl_certificate /etc/nginx/tls/frappe-us-payroll.localhost.pem;
	ssl_certificate_key /etc/nginx/tls/frappe-us-payroll.localhost-key.pem;
	ssl_protocols TLSv1.2 TLSv1.3;

	location /socket.io {
		proxy_pass http://frappe:9000;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host frappe-us-payroll.localhost;
		proxy_set_header X-Forwarded-Proto https;
		proxy_set_header X-Forwarded-Port 8445;
	}

	location / {
		proxy_pass http://frappe:8000;
		proxy_http_version 1.1;
		proxy_set_header Host frappe-us-payroll.localhost;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto https;
		proxy_set_header X-Forwarded-Host $http_host;
		proxy_set_header X-Forwarded-Port 8445;
	}
}
