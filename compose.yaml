services:
  frappe:
    ports: !override []
    volumes:
      - frappe-home:/home/frappe
      - type: bind
        source: ${FRAPPE_US_PAYROLL_DIR}
        target: /workspace/frappe_us_payroll

  tls-proxy:
    image: nginx:1.27-alpine
    profiles:
      - https
    depends_on:
      - frappe
    ports:
      - "${FRAPPE_US_PAYROLL_HTTPS_PORT:-8445}:443"
    volumes:
      - type: bind
        source: ${FRAPPE_US_PAYROLL_DIR}/docker/local-https.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      - type: bind
        source: ${FRAPPE_US_PAYROLL_DIR}/.local-certs
        target: /etc/nginx/tls
        read_only: true

volumes:
  frappe-home:
